schema: spec-driven

context: |
  Tech stack: Python 3.12+, PyScript (runs in browser via Pyodide/Emscripten)
  Frontend framework: WebComPy — component-based, reactive, SPA
  Server: Starlette + uvicorn (dev server, SSG)
  Package manager: uv
  Conventions: conventional commits, type annotations throughout, no comments unless requested

  ## Known Issues (to be resolved in future changes)

  ### Signal System
  - No element-level reactivity in ReactiveList/ReactiveDict — any mutation triggers full change notification (ReactiveList now exposes _last_mutation metadata for incremental consumers)
  - __purge_signal_members__ in SignalReceivable properly calls consumer_destroy() for cleanup

  ### Component System
  - Component IDs are MD5 hashes — not collision-proof

  ### Element System
  - No general virtual DOM diffing — updates are direct DOM manipulation; key-based reconciliation exists only for RepeatElement (list-reconciliation)
  - SwitchElement replaces children when branch structures differ; matching structures reuse DOM nodes via patching

  ### Router
  - Location popstate proxy cleanup relies on `BrowserHistoryPort.__del__`, which may never run because the browser event target can retain the proxy and its callback; no explicit port/context disposal path removes the listener and destroys the proxy

  ### General
  - Browser detection is binary (Emscripten vs other) — no partial API availability checks
  - Module-level fallbacks (_app_di_scope, _app_instance) hold only one app reference in browser environment, limiting true multi-app isolation

# Per-artifact rules (optional)
rules:
  proposal:
    - Always include a "Known Issues Addressed" section when a change relates to any known issue
    - Always include a "Non-goals" section
  tasks:
    - Break tasks into chunks of max 2 hours
    - When specs are added, modified, or removed, update .opencode/skills/webcompy-review/SKILL.md to keep the file→spec mapping and Critical Framework Invariants in sync
