<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/_webcompy-ui/index.css">
</head>
<body>
<div id="webcompy-loading">
  <style>#webcompy-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.15);z-index:9999}.wc-loader{border:3px solid lightgray;border-radius:50%;border-top:3px solid skyblue;width:40px;height:40px;animation:spin 0.8s linear infinite}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
  <div class="wc-loader"></div>
</div>

<div id="webcompy-app"></div>

<script id="demo-script" type="py"></script>

<script>
  (() => {
    const APP_PACKAGES = {
      helloworld: [],
      todo: [],
      routing: [],
      storage_sync: [],
      teleport: [],
      transition: [],
      ui_form_controls: [],
      i18n_playground: [],
      fetch_sample: [],
      fetch_middleware_mock: [],
      rpc_middleware_mock: [],
      matplotlib_sample: ["numpy", "matplotlib"],
      "todo_tutorial/step1": [],
      "todo_tutorial/step2": [],
      "todo_tutorial/step3": [],
      "todo_tutorial/step4": [],
      "todo_tutorial/step5": [],
      "todo_tutorial/step6": [],
    };
    const p = new URLSearchParams(location.search);
    const app = p.get("app");
    if (!app || !(app in APP_PACKAGES)) {
      document.body.textContent = "Invalid app name.";
      return;
    }

    const isSafeLocalRuntimeUrl = (u) =>
      typeof u === "string" && /^\/_webcompy-assets\/[A-Za-z0-9._-]+\//.test(u);
    const isSafeCoreAssetUrl = (u) =>
      typeof u === "string" &&
      /^(\/_webcompy-assets\/|https:\/\/pyscript\.net\/releases\/)[A-Za-z0-9._-]+\//.test(u);

    let wheel = "";
    let parentInterpreter = "";
    let parentLockfileUrl = "";
    let coreJs = "";
    let coreCss = "";
    try {
      const parentDoc = window.parent.document;
      const parentScript = parentDoc.querySelector('script[type="py"][config]');
      if (parentScript) {
        const raw = parentScript.getAttribute("config").replace(/&quot;/g, '"');
        const config = JSON.parse(raw);
        wheel = config.packages.find(function (p) { return p.indexOf("webcompy-") !== -1; }) || "";
        parentInterpreter = config.interpreter || "";
        parentLockfileUrl = config.lockFileURL || "";
      }
      const parentCoreScript = parentDoc.querySelector('script[type="module"][src*="core.js"]');
      if (parentCoreScript) {
        coreJs = parentCoreScript.getAttribute("src") || "";
      }
      const parentCoreCss = parentDoc.querySelector('link[rel="stylesheet"][href*="core.css"]');
      if (parentCoreCss) {
        coreCss = parentCoreCss.getAttribute("href") || "";
      }
    } catch (e) {
      console.error("Failed to resolve runtime configuration from parent config:", e);
    }
    if (!wheel || !/^\/_webcompy-app-package\//.test(wheel)) {
      document.body.textContent = "Wheel URL not found.";
      return;
    }
    if (!isSafeCoreAssetUrl(coreJs)) {
      document.body.textContent = "Runtime URL not found.";
      return;
    }

    if (isSafeCoreAssetUrl(coreCss)) {
      const cssLink = document.createElement("link");
      cssLink.rel = "stylesheet";
      cssLink.href = coreCss;
      document.head.appendChild(cssLink);
    }

    const extra = APP_PACKAGES[app];
    const config = {
      packages: [wheel, ...extra],
      experimental_create_proxy: "auto",
    };
    if (extra.length === 0 && isSafeLocalRuntimeUrl(parentInterpreter) && isSafeLocalRuntimeUrl(parentLockfileUrl)) {
      config.interpreter = parentInterpreter;
      config.lockFileURL = parentLockfileUrl;
    }

    const script = document.getElementById("demo-script");
    script.setAttribute("src", "/_demos/" + app + "/app.py");
    script.setAttribute("config", JSON.stringify(config));

    const coreScript = document.createElement("script");
    coreScript.type = "module";
    coreScript.src = coreJs;
    document.body.appendChild(coreScript);
  })();
</script>

</body>
</html>
