[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
webcompy = { workspace = true }
webcompy-server = { workspace = true }
webcompy-cli = { workspace = true }
webcompy-testing = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "B",
    "D205",
    "D209",
    "D212",
    "D413",
    "D415",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "TCH",
    "UP",
    "W",
]
ignore = [
    "E501",
    "UP046",
    "UP040",
    "UP047",
    "E731",
    "TC001",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D205", "D209", "D212", "D413", "D415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["e2e/core"]



[tool.ruff.lint.isort]
known-first-party = ["webcompy", "webcompy_server", "webcompy_cli", "webcompy_testing"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
# _css_parser.parse_css raises transitively via helpers; DOC502 only sees direct
# raise statements, so that file is excluded from pydoclint (docstring presence
# there is still enforced by scripts/check-docstrings.py).
exclude = "(?x)packages/webcompy/src/webcompy/template/_css_parser\\.py"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingModuleSource = "none"
reportMissingTypeStubs = "none"
reportMissingImports = "none"
reportInvalidTypeForm = "warning"
reportAttributeAccessIssue = "warning"
exclude = [
    "docs/**",
    "docs_app/**",
    "tests/**",
    "e2e/**",
    "**/node_modules/**",
    ".venv/**",
]
include = [
    "packages/webcompy/src/webcompy",
    "packages/webcompy-server/src/webcompy_server",
    "packages/webcompy-cli/src/webcompy_cli",
    "packages/webcompy-testing/src/webcompy_testing",
    "docs_app",
    "tests",
]
extraPaths = [
    "packages/webcompy/src",
    "packages/webcompy-server/src",
    "packages/webcompy-cli/src",
    "packages/webcompy-testing/src",
]
stubPath = "packages/webcompy/src/webcompy/ports"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.14.1",
    "fastapi>=0.141.1",
    "nest-asyncio>=1.6.0",
    "nodeenv>=1.10.0",
    "playwright>=1.58.0",
    "pre-commit>=4.5.1",
    "pydoclint>=0.9.1",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.7.2",
    "ruff>=0.15.10",
    "websockets>=17.0.1",
]
docs = [
    "matplotlib>=3.9.0,<4",
    "numpy==2.2.5",
]
