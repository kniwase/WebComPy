name: バグ報告 (Bug Report)
description: 不具合・バグを報告する
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告は英語・日本語のどちらでも構いません。

  - type: dropdown
    id: environment
    attributes:
      label: 環境 (Environment)
      description: 不具合が発生した環境を選択してください
      options:
        - ブラウザ (Browser / PyScript)
        - サーバー (Server / CLI / SSG)
        - 両方 (Both)
    validations:
      required: true

  - type: input
    id: webcompy-version
    attributes:
      label: WebComPy バージョン
      placeholder: "例: 0.8.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python バージョン
      placeholder: "例: 3.12"
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: ブラウザ (該当する場合)
      description: 不具合が発生したブラウザとバージョン
      placeholder: "例: Chrome 125, Firefox 128"

  - type: input
    id: pyscript-version
    attributes:
      label: PyScript / Pyodide バージョン (該当する場合)
      placeholder: "例: PyScript 2024.11.1, Pyodide 0.26.0"

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 再現手順 (Steps to Reproduce)
      description: 再現に必要な最小限の手順やコードを記載してください
      placeholder: |
        1. コンポーネントを作成し ...
        2. 関数を呼び出すと ...
        3. エラーが発生する
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作 (Expected Behavior)
      description: 本来想定していた動作を記載してください

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作 (Actual Behavior)
      description: 実際に起きた現象を記載してください

  - type: textarea
    id: relevant-spec
    attributes:
      label: 関連スペック (任意)
      description: 関連する OpenSpec の仕様が分かる場合はパスやリンクを記載してください
      placeholder: "例: openspec/specs/reactive/spec.md"

  - type: textarea
    id: logs
    attributes:
      label: コンソールログ / スクリーンショット
      description: コンソール出力、エラーメッセージ、スクリーンショットなどがあれば貼り付けてください
      placeholder: ブラウザのコンソールエラーやサーバーの標準出力などを貼り付けてください
