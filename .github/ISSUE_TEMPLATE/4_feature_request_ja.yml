name: 機能要望 (Feature Request)
description: 機能追加の要望や改善アイデアを共有する
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        機能要望やアイデアの投稿は英語・日本語のどちらでも構いません。
        大きな機能追加や仕様変更は [OpenSpec ワークフロー](CONTRIBUTING.ja.md#開発ワークフロー) に沿って進めます。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題 (Problem Statement)
      description: 解決したい課題や具体的なユースケースを記載してください
      placeholder: |
        X を構築する際に Y をしたいのですが、現在は ... という回避策が必要です
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策 (Proposed Solution)
      description: 実現したい API や動作のイメージを記載してください
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案 (Alternatives Considered)
      description: 他に検討した方法や回避策があれば記載してください

  - type: checkboxes
    id: openspec
    attributes:
      label: OpenSpec 提案
      description: ご自身で実装や提案まで進める場合の確認項目（任意）
      options:
        - label: この件について OpenSpec の変更提案の作成を検討している
